name: Local acceptance tests
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'e2e/**', 'docker-compose.yml', 'Makefile', '.github/workflows/aqa.yml']
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        run: |
          python -m pip install -r e2e/requirements.txt
          python -m playwright install chromium --with-deps
      - name: Start a clean local restaurant
        run: docker compose up --build --wait --wait-timeout 240
      - name: API and browser acceptance
        run: python backend/scripts/check_local.py e2e
      - name: Collect logs
        if: always()
        run: docker compose logs --no-color > restaurant-compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-logs
          path: restaurant-compose.log
      - name: Remove this CI run's containers and data
        if: always()
        run: docker compose down --volumes
